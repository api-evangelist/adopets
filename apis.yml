aid: adopets
name: Adopets
description: >-
  Adopets is an Adoption Management System (AMS) for animal shelters and rescues that streamlines
  the entire pet adoption process — online and in-person applications, approval and team
  collaboration workflows, digital kennel cards with QR codes, secure payment processing for
  adoption fees, licenses, products and donations, daily reporting and dashboards, and
  post-adoption communication. Backed by Techstars. Adopets exposes an External API (documented
  as a public Postman collection) that lets partner systems connect staff users and create,
  retrieve, change, cancel, and refund adoption payment requests and transactions on behalf of an
  organization, authenticated with an organization API key plus a per-session JWT bearer token.
